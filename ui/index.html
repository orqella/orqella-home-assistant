<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home Assistant</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/assets/module.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="module" id="screen">
    <div class="boot">
      <span class="boot-mark" aria-hidden="true">⌂</span>
      <div>
        <p class="eyebrow">Home Assistant</p>
        <h1 id="title">Opening dashboard…</h1>
        <p class="muted" id="detail">Checking the Home Assistant connection.</p>
      </div>
    </div>
    <div class="actions" id="actions" hidden>
      <button id="retry" type="button">Try again</button>
    </div>
    <pre class="setup" id="setup" hidden></pre>
  </main>
  <script src="app.js"></script>
</body>
</html>
